<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finn Tennis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-rows: 60px 1fr 40px;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";
            height: 100vh;
        }
        header {
            grid-area: header;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        nav {
            grid-area: sidebar;
            background: #eee;
            padding: 20px;
        }
        main {
            grid-area: content;
            padding: 20px;
        }
        footer {
            grid-area: footer;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .placeholder {
            background: #ddd;
            border: 1px dashed #bbb;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="placeholder">Header</div>
    </header>
    <nav>
        <div class="placeholder">Sidebar</div>
    </nav>
    <main>
        <div class="placeholder">Content Area</div>
    </main>
    <footer>
        <div class="placeholder">Footer</div>
    </footer>
</body>
</html>
