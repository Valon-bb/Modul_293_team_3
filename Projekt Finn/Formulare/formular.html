<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrierungsformular</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    .form-group {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .form-group label {
      width: 30%;
      text-align: right;
      margin-right: 10px;
    }
    .form-group input, .form-group select {
      width: 65%;
      padding: 5px;
    }
    .form-group input[type="radio"] {
      width: auto;
    }
    .form-group .checkbox {
      width: auto;
      margin-left: 10px;
    }
    .form-group .checkbox label {
      width: auto;
      text-align: left;
    }
    .form-group .checkbox input {
      width: auto;
    }
    .form-group .submit-btn {
      text-align: center;
    }
    .form-group .submit-btn input {
      width: auto;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <form action="bestaetigung.html" method="post">
      <div class="form-group">
        <label for="geschlecht">Geschlecht:</label>
        <div>
          <input type="radio" id="male" name="geschlecht" value="male" required> <label for="male">Männlich</label>
          <input type="radio" id="female" name="geschlecht" value="female" required> <label for="female">Weiblich</label>
        </div>
      </div>
      <div class="form-group">
        <label for="vorname">Vorname:</label>
        <input type="text" id="vorname" name="vorname" required>
      </div>
      <div class="form-group">
        <label for="nachname">Nachname:</label>
        <input type="text" id="nachname" name="nachname" required>
      </div>
      <div class="form-group">
        <label for="email">E-Mail:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="adresse">Adresse:</label>
        <input type="text" id="adresse" name="adresse" required>
      </div>
      <div class="form-group">
        <label for="plz">PLZ:</label>
        <input type="text" id="plz" name="plz" required>
      </div>
      <div class="form-group">
        <label for="ort">Ort:</label>
        <input type="text" id="ort" name="ort" required>
      </div>
      <div class="form-group">
        <label for="land">Land:</label>
        <select id="land" name="land" required>
          <option value="">Bitte wählen</option>
          <option value="de">Deutschland</option>
          <option value="at">Österreich</option>
          <option value="ch">Schweiz</option>
        </select>
      </div>
      <div class="form-group checkbox">
        <input type="checkbox" id="datenschutz" name="datenschutz" required>
        <label for="datenschutz">Ich akzeptiere die Datenschutzbestimmungen</label>
      </div>
      <div class="form-group submit-btn">
        <input type="submit" value="Registrieren">
      </div>
    </form>
  </div>
</body>
</html>
