      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-rows: 60px 1fr 40px;
        grid-template-columns: 200px 1fr;
        grid-template-areas:
            "header header"
            "sidebar content"
            "footer footer";
        height: 100vh;
      }

      header {
        grid-area: header;
        background: #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
        nav {
          grid-area: sidebar;
          background: #eee;
          padding: 20px;
      }

      main {
        grid-area: content;
        padding: 20px;
      }



      .grid-container {
        display: grid;
        grid-template-columns: auto auto auto;
        gap: 10px;
        background-color: #000000;
        padding: 10px;
      }
      .grid-container > div {
        background-color: #ffffffcc;
        text-align: center;
        padding: 100px 10px;
        font-size: 60px;
      }

      .placeholder {
        background: #ddd;
        border: 1px dashed #bbb;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }


      footer {
        text-align: center; 
        grid-area: footer;
        background: #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
      }






      ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;
      }
      
      li {
        float: left;
      }
      
      li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
      }
      
      /* Change the link color to #111 (black) on hover */
      li a:hover {
        background-color: #111;
      }


    </style>
