<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finn Tennis</title><style>body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-rows: 60px 1fr 40px;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";
            height: 100vh;
            background: linear-gradient(to bottom, #f5f5f5, #dcdcdc);
        }

        header {
            grid-area: header;
            background: #444;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        aside {
            grid-area: sidebar;
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            overflow-y: auto;
        }

        aside img {
            width: 100%;
            border-radius: 8px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        aside img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        main {
            grid-area: content;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        nav ul li {
            flex-grow: 1;
        }

        nav ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s;
        }

        nav ul li a:hover {
            background-color: #555;
            transform: scale(1.1);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background-color: #000;
            padding: 20px;
            border-radius: 8px;
            height: 90%;
            animation: fadeIn 1s ease-out;
        }

        .grid-container > div {
            background-color: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 20px;
            font-size: 30px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, background-color 0.3s;
        }

        .grid-container > div:hover {
            transform: translateY(-10px);
            background-color: #ddd;
        }

        footer {
            grid-area: footer;
            background: #444;
            color: white;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
            
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }</style></head><body><header>Finn Tennis</header><aside><img src="./Medien/aufschlag.jpg" alt="Aufschlag" style="width: 90%;"></aside><main><nav><ul><li><a href="index3.html">Home</a></li><li><a href="regeln.html">Regeln</a></li><li><a href="technik.html">Technik</a></li><li><a href="ausruestung.html">Ausrüstung</a></li><li><a href="spieler.html">Berühmte Spieler</a></li><li><a href="events.html">Events</a></li></ul></nav><div class="grid-container"><div class="item1"><img src="./Medien/ic.webp" alt="Action Foto" style="width: 80%;"></div><div class="item2">Herzlich Willkommen zu meiner Webseite über Tennis</div><div class="item3"><img src="./Medien/schläger.jpg" alt="Tennisschläger" style="width: 80%;"></div><div class="item4"><h2>Registrierungsformular</h2><form action="index3.html" method="post"><label for="email">E-Mail-Adresse:</label><br><input type="email" id="email" name="email" required><br><br><label for="name">Vorname:</label><br><input type="text" id="name" name="name" required><br><br><label for="nachname">Nachname:</label><br><input type="text" id="nachname" name="nachname" required><br><br><label for="passwort">Passwort:</label><br><input type="password" id="passwort" name="passwort" required><br><br><button type="submit">Registrieren</button></form></div><div class="item5"><img src="./Medien/platz.png" alt="Tennisplatz" style="width: 80%;"></div><div class="item6"><a href="about.html">Über mich</a></div></div></main><footer><p><a href="index3.html">Home </a>- <a href="https://www.eurosport.de/tennis/">News </a>- <a href="agb.html">AGB </a>- <a href="about.html">About </a>- <a href="impressum.html">Impressum </a>- <a href="mailto:beda.brunner@edu.tbz.ch">Kontakt</a></p></footer></body></html>
