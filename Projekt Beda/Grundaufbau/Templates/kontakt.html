<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inhaltsseite</title>

</head>
<body>
  <header>
    <nav>
      <a href="index.html">Zurück zur Startseite</a>
      <a href="touren.html">Touren</a>
      <a href="regeln.html">Regeln</a>
      <a href="gear.html">Gear</a>
      <a href="tipps.html">Tipps</a>
    </nav>
  </header>

  <main>
    <!-- Die Flexbox sorgt für eine zentrierte und gut formatierte Darstellung -->
    <div class="kontakt">
      <section class="history-form">
        <h3>Kontaktieren Sie uns für mehr Informationen</h3>
        <form onsubmit="location.reload(); return false;">
          <label for="name">Ihr Name:</label>
          <input type="text" id="name" name="name" required>
          
          <label for="email">Ihre E-Mail-Adresse:</label>
          <input type="email" id="email" name="email" required>
          
          <label for="message">Ihre Nachricht:</label>
          <textarea id="message" name="message" rows="4" required></textarea>
          
          <button type="submit">Absenden</button>
        </form>
      </section>
    </div>
  </main>

  <footer>
  </footer>
</body>
</html>
